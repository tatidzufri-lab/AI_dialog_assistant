services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retreat
      POSTGRES_USER: postgres
      # Единственный источник пароля — .env, который не попадает в репозиторий.
      # Раньше пароль был записан здесь прямым текстом и разошёлся со строкой
      # подключения в .env, из-за чего бот не мог войти в базу.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retreat"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу НЕ публикуем: бот обращается к базе по имени сервиса db
    # внутри сети compose. Публикация была опасна — docker пишет свои правила
    # в iptables мимо UFW, поэтому "5432:5432" открывало Postgres в интернет,
    # несмотря на закрытый файрвол.
    restart: unless-stopped
    volumes:
      - retreat_data:/var/lib/postgresql/data

  bot:
    build: .
    env_file:
      - .env
    environment:
      # Собирается из того же POSTGRES_PASSWORD, что и у базы, чтобы пароль
      # нельзя было задать в двух местах по-разному.
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/retreat
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  retreat_data:
